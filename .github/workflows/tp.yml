name: Channel Logo Scraper API

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT REPO
      # =========================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # PYTHON SETUP
      # =========================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # =========================
      # INSTALL LIBRARIES
      # =========================

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 lxml cloudscraper

      # =========================
      # RUN SCRAPER
      # =========================

      - name: Run Scraper
        run: |

          cat > scraper.py << 'EOF'

          import os
          import re
          import json
          import time
          import requests
          import cloudscraper

          from bs4 import BeautifulSoup
          from urllib.parse import urlparse

          # ====================================
          # WEBSITE
          # ====================================

          URL = "https://dev.denver69.fun/TP/"

          IMAGE_DIR = "images"
          JSON_FILE = "tp.json"

          # ====================================
          # BROWSER HEADERS
          # ====================================

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/136.0.0.0 Safari/537.36"
              ),
              "Accept": "*/*",
              "Accept-Language": "en-US,en;q=0.9",
              "Connection": "keep-alive",
              "Referer": "https://google.com/"
          }

          # ====================================
          # CLOUDSCRAPER SESSION
          # ====================================

          scraper = cloudscraper.create_scraper(
              browser={
                  "browser": "chrome",
                  "platform": "windows",
                  "mobile": False
              }
          )

          scraper.headers.update(headers)

          # ====================================
          # FETCH WEBSITE
          # ====================================

          print("Fetching Website...")

          html = None

          for attempt in range(5):

              try:

                  response = scraper.get(
                      URL,
                      timeout=60
                  )

                  if response.status_code == 200:

                      html = response.text

                      print("Website Loaded Successfully")

                      break

                  else:

                      print(
                          f"HTTP {response.status_code}"
                      )

              except Exception as e:

                  print(
                      f"Retry {attempt+1}: {e}"
                  )

                  time.sleep(5)

          if not html:

              raise Exception(
                  "Failed to fetch website"
              )

          # ====================================
          # PARSE HTML
          # ====================================

          soup = BeautifulSoup(
              html,
              "lxml"
          )

          cards = soup.find_all(
              "div",
              class_="channel-card"
          )

          print(f"Found {len(cards)} channels")

          channels = []

          # ====================================
          # CLEAN FILE NAME
          # ====================================

          def clean_filename(name):

              name = name.replace(" ", "")

              name = re.sub(
                  r'[\\\\/:*?"<>|]',
                  '',
                  name
              )

              return name.strip()

          # ====================================
          # CLEAN FOLDER
          # ====================================

          def clean_folder(name):

              name = re.sub(
                  r'[\\\\/:*?"<>|]',
                  '',
                  name
              )

              return name.strip()

          # ====================================
          # LOOP CHANNELS
          # ====================================

          for card in cards:

              try:

                  # CHANNEL ID
                  channel_id = card.get(
                      "data-id",
                      ""
                  ).strip()

                  # GENRE
                  genre = clean_folder(
                      card.get(
                          "data-genre",
                          "Unknown"
                      )
                  )

                  # CHANNEL NAME
                  name_tag = card.find(
                      "div",
                      class_="channel-name"
                  )

                  if not name_tag:
                      continue

                  channel_name = name_tag.text.strip()

                  # IMAGE
                  img_tag = card.find(
                      "img",
                      class_="channel-logo"
                  )

                  if not img_tag:
                      continue

                  image_url = img_tag.get("src")

                  if not image_url:
                      continue

                  # CLEAN NAME
                  clean_name = clean_filename(
                      channel_name
                  )

                  # CREATE FOLDER
                  genre_path = os.path.join(
                      IMAGE_DIR,
                      genre
                  )

                  os.makedirs(
                      genre_path,
                      exist_ok=True
                  )

                  # EXTENSION
                  parsed = urlparse(image_url)

                  ext = os.path.splitext(
                      parsed.path
                  )[1]

                  if not ext:
                      ext = ".png"

                  # FINAL FILE
                  filename = f"{clean_name}{ext}"

                  save_path = os.path.join(
                      genre_path,
                      filename
                  )

                  print(
                      f"Downloading: {channel_name}"
                  )

                  # DOWNLOAD IMAGE
                  img = scraper.get(
                      image_url,
                      timeout=60
                  )

                  if img.status_code == 200:

                      with open(
                          save_path,
                          "wb"
                      ) as f:

                          f.write(img.content)

                      local_image = (
                          f"images/{genre}/{filename}"
                      )

                      # JSON DATA
                      channels.append({

                          "id": channel_id,

                          "name": channel_name,

                          "genre": genre,

                          "image": local_image,

                          "source": image_url

                      })

                      print(
                          f"Saved: {local_image}"
                      )

                  else:

                      print(
                          f"Image Failed: {image_url}"
                      )

              except Exception as e:

                  print(
                      f"ERROR: {e}"
                  )

          # ====================================
          # SAVE JSON
          # ====================================

          with open(
              JSON_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  channels,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print(
              f"Saved {len(channels)} channels"
          )

          EOF

          python scraper.py

      # =========================
      # COMMIT & PUSH
      # =========================

      - name: Commit and Push
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/ tp.json

          git diff --cached --quiet || git commit -m "Updated channels API"

          git push
