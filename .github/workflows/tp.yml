name: Channel Logo Scraper API

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT REPOSITORY
      # =========================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # SETUP PYTHON
      # =========================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # =========================
      # INSTALL DEPENDENCIES
      # =========================

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      # =========================
      # RUN SCRAPER
      # =========================

      - name: Run Scraper
        run: |

          cat > scraper.py << 'EOF'

          import os
          import re
          import json
          import requests

          from bs4 import BeautifulSoup
          from urllib.parse import urlparse

          # ====================================
          # WEBSITE URL
          # ====================================

          URL = "https://dev.denver69.fun/TP/"

          # ====================================
          # OUTPUT FILES
          # ====================================

          IMAGE_DIR = "images"
          JSON_FILE = "channels.json"

          # ====================================
          # REQUEST HEADERS
          # ====================================

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          # ====================================
          # FETCH WEBSITE
          # ====================================

          print("Fetching Website...")

          response = requests.get(
              URL,
              headers=headers,
              timeout=30
          )

          response.raise_for_status()

          html = response.text

          # ====================================
          # PARSE HTML
          # ====================================

          soup = BeautifulSoup(
              html,
              "lxml"
          )

          cards = soup.find_all(
              "div",
              class_="channel-card"
          )

          print(f"Found {len(cards)} channels")

          # ====================================
          # JSON ARRAY
          # ====================================

          channels = []

          # ====================================
          # CLEAN FILE NAME
          # ====================================

          def clean_filename(name):

              # REMOVE SPACES
              name = name.replace(" ", "")

              # REMOVE INVALID CHARS
              name = re.sub(
                  r'[\\\\/:*?"<>|]',
                  '',
                  name
              )

              return name.strip()

          # ====================================
          # CLEAN FOLDER NAME
          # ====================================

          def clean_folder(name):

              name = re.sub(
                  r'[\\\\/:*?"<>|]',
                  '',
                  name
              )

              return name.strip()

          # ====================================
          # LOOP CHANNELS
          # ====================================

          for card in cards:

              try:

                  # ===============================
                  # CHANNEL ID
                  # ===============================

                  channel_id = card.get(
                      "data-id",
                      ""
                  ).strip()

                  # ===============================
                  # CHANNEL GENRE
                  # ===============================

                  genre = clean_folder(
                      card.get(
                          "data-genre",
                          "Unknown"
                      )
                  )

                  # ===============================
                  # CHANNEL NAME
                  # ===============================

                  name_tag = card.find(
                      "div",
                      class_="channel-name"
                  )

                  if not name_tag:
                      continue

                  channel_name = name_tag.text.strip()

                  # ===============================
                  # IMAGE TAG
                  # ===============================

                  img_tag = card.find(
                      "img",
                      class_="channel-logo"
                  )

                  if not img_tag:
                      continue

                  image_url = img_tag.get("src")

                  if not image_url:
                      continue

                  # ===============================
                  # CLEAN FILE NAME
                  # ===============================

                  clean_name = clean_filename(
                      channel_name
                  )

                  # ===============================
                  # CREATE GENRE FOLDER
                  # ===============================

                  genre_path = os.path.join(
                      IMAGE_DIR,
                      genre
                  )

                  os.makedirs(
                      genre_path,
                      exist_ok=True
                  )

                  # ===============================
                  # FILE EXTENSION
                  # ===============================

                  parsed = urlparse(image_url)

                  ext = os.path.splitext(
                      parsed.path
                  )[1]

                  if not ext:
                      ext = ".png"

                  # ===============================
                  # FINAL FILE NAME
                  # ===============================

                  filename = f"{clean_name}{ext}"

                  # ===============================
                  # SAVE PATH
                  # ===============================

                  save_path = os.path.join(
                      genre_path,
                      filename
                  )

                  # ===============================
                  # DOWNLOAD IMAGE
                  # ===============================

                  print(f"Downloading: {channel_name}")

                  img_response = requests.get(
                      image_url,
                      headers=headers,
                      timeout=30
                  )

                  if img_response.status_code == 200:

                      with open(
                          save_path,
                          "wb"
                      ) as f:

                          f.write(
                              img_response.content
                          )

                      # ===========================
                      # LOCAL IMAGE PATH
                      # ===========================

                      local_image = (
                          f"images/{genre}/{filename}"
                      )

                      # ===========================
                      # ADD JSON ENTRY
                      # ===========================

                      channels.append({

                          "id": channel_id,

                          "name": channel_name,

                          "genre": genre,

                          "image": local_image,

                          "source": image_url

                      })

                      print(
                          f"Saved: {local_image}"
                      )

                  else:

                      print(
                          f"Failed: {image_url}"
                      )

              except Exception as e:

                  print(
                      f"ERROR: {e}"
                  )

          # ====================================
          # SAVE JSON FILE
          # ====================================

          with open(
              JSON_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  channels,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # ====================================
          # DONE
          # ====================================

          print(
              f"Saved {len(channels)} channels"
          )

          EOF

          python scraper.py

      # =========================
      # COMMIT & PUSH
      # =========================

      - name: Commit and Push
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/ channels.json

          git diff --cached --quiet || git commit -m "Updated channel logos and JSON API"

          git push
